function gameWeek4(s){const base="초등학생이 즐길 수 있는 간단하고 귀여운 '별 모으기 게임'을 만들어 줘.\n\n[게임 필수 규칙]\n1. 바구니를 키보드의 왼쪽(←), 오른쪽(→) 방향키로 좌우로 부드럽게 움직이게 해 줘.\n2. 밤하늘에서 반짝이는 노란 별들이 하나씩 아래로 떨어지게 해 줘.\n3. 바구니로 별을 받으면 '점수'가 1점씩 올라가게 해 줘.\n4. 30초 타이머가 있어서 30초가 지나면 게임이 끝나고 최종 점수를 크게 보여줘.\n5. 밝고 알록달록한 파스텔 그림으로 꾸미고, [시작하기] 버튼과 [다시하기] 버튼을 꼭 넣어 줘.\n6. Gemini Canvas 미리보기 창에서 바로 마우스와 키보드로 플레이할 수 있게 완성해 줘!";const speed="별이 너무 빠르게 떨어져. 게임 화면 아래에 [느리게], [보통], [빠르게] 3단계 속도 조절 버튼을 만들어 줘!";const rescue="방금 수정한 것 때문에 게임 조작이 멈췄어. 이전처럼 다시 키보드 방향키로 움직이고 별이 떨어지게 에러를 고쳐서 다시 실행해 줘!";if(s===0)return '<h3 class="sectiontitle">🎮 4주차 · 내가 만든 게임이 진짜 움직인다고?</h3><p class="leadin">Gemini Canvas에서 코딩 지식 없이 게임을 만들고, 테스트한 뒤 한 번에 하나씩 나만의 게임으로 바꿔 봅니다.</p><div class="ref"><strong>게임을 구성하는 5가지 마법 열쇠</strong><p>1. 주인공 — 움직이는 바구니</p><p>2. 목표 — 떨어지는 별 받기</p><p>3. 규칙 — 30초 동안 점수 모으기</p><p>4. 조작 — 키보드 좌우 방향키</p><p>5. 점수판 — 별 1개당 1점</p></div><div class="callout">오늘의 목표: 공통 게임을 먼저 실행하고, 내 생각을 한 번에 하나씩 반영해 나만의 게임으로 업그레이드하기</div>';if(s===1)return '<h3 class="sectiontitle">① 공통 기본 게임 만들기</h3><p class="leadin">아래 프롬프트를 Gemini에 붙여넣으면 Canvas 미리보기에서 바로 실행되는 게임을 만듭니다.</p>'+command(base,'기본 게임 프롬프트 복사')+'<div class="ref"><strong>첫 번째 프롬프트로 만든 게임</strong><p><a href="https://sites.google.com/view/yongsanele/full-page-embed" target="_blank" rel="noopener noreferrer">게임 결과 링크를 새 탭에서 열기</a></p></div><div class="ref"><strong>게임 테스트 체크리스트</strong><p>□ [시작하기] 버튼을 누르면 게임이 시작되나요?</p><p>□ 좌우 방향키로 바구니가 움직이나요?</p><p>□ 별을 받으면 점수가 1점씩 올라가나요?</p><p>□ 30초 뒤 게임이 끝나고 최종 점수가 나오나요?</p></div>';if(s===2)return '<h3 class="sectiontitle">② 나만의 게임으로 변신하기</h3><p class="leadin">기본 게임이 잘 움직이면 한 번에 딱 하나씩만 바꿔 봅니다.</p><div class="ref"><strong>추천 수정 1순위 · 속도 조절</strong><p>별이 너무 빠르게 떨어질 때 아래 요청을 사용해 보세요.</p>'+command(speed,'속도 조절 프롬프트 복사')+'</div><div class="ref"><strong>주인공과 아이템 바꾸기</strong>'+command("바구니 대신 귀여운 '토끼'로 주인공을 바꾸고, 하늘에서 별 대신 '달콤한 딸기'가 떨어지게 해 줘!",'토끼·딸기 변신 복사')+'</div><div class="ref"><strong>배경과 테마 바꾸기</strong>'+command("배경을 우주로 바꾸고, 주인공은 '날아가는 우주선', 떨어지는 아이템은 '반짝이는 보석'으로 바꿔 줘!",'우주선·보석 변신 복사')+'</div>';if(s===3)return '<h3 class="sectiontitle">③ 이런 것도 바꿀 수 있어요</h3><p class="leadin">마음에 드는 아이디어 하나를 골라 Gemini에 한 문장으로 요청해 보세요.</p><div class="ref"><strong>⚡ 속도·난이도 조절</strong><p>“화면 아래에 [느리게], [보통], [빠르게] 속도 조절 버튼을 만들어 줘!”</p><strong>💣 방해 아이템</strong><p>“별 사이에 가끔 떨어지는 폭탄을 넣고 닿으면 1점 깎이게 해 줘!”</p><strong>❤️ 목숨 시스템</strong><p>“별을 놓치면 하트가 1개씩 깎이고 3개를 잃으면 게임오버되게 해 줘!”</p><strong>⭐ 보너스 황금별</strong><p>“가끔 빠르게 떨어지는 황금별을 받으면 5점 올라가게 해 줘!”</p><strong>⏱ 목표 점수 미션</strong><p>“30초 안에 15점을 모으면 미션 성공 축하 폭죽이 터지게 해 줘!”</p><strong>🎨 주인공·배경 변신</strong><p>“주인공을 토끼나 고양이로 바꾸고 배경을 과자 나라나 바닷속으로 바꿔 줘!”</p></div>';if(s===4)return '<h3 class="sectiontitle">④ 게임이 멈췄을 때와 완주 발표</h3><div class="ref"><strong>🚨 게임이 멈추거나 먹통이 되었을 때</strong><p>AI가 코드를 고치다가 게임이 멈출 수 있어요. 아래 응급처치 프롬프트를 보내거나 Canvas 오른쪽 위의 버전 되돌리기 아이콘을 눌러 보세요.</p>'+command(rescue,'응급처치 프롬프트 복사')+'</div><div class="callout"><strong>짝꿍 게임 체험</strong><p>짝꿍과 자리를 바꿔 서로의 게임을 플레이해 보세요. 내가 바꾼 것은 무엇인지, AI가 내 생각대로 고쳐 주었는지 소감을 나눕니다.</p></div>';return '<h3 class="sectiontitle">⑤ 결과 확인과 후기</h3><p class="leadin">완성한 게임을 친구와 함께 체험하고, 무엇을 바꾸었는지 이야기해 봅니다.</p><div class="ref"><strong>함께 이야기할 질문</strong><p>처음 게임에서 무엇을 바꾸었나요?</p><p>내가 생각한 대로 게임이 움직이나요?</p><p>다음에 더 바꾸고 싶은 점은 무엇인가요?</p></div>'+reviewPanel();}

function compare(){if(state.week===3)return gameCompare();let w=current();return `<div class="banner"><h2>결과 비교 예시</h2><p>두 가지 요청 방식의 차이를 학생과 함께 관찰합니다.</p></div><div class="lesson"><label class="label" for="cw">차시 선택</label><select id="cw" style="padding:12px;margin:0 0 20px 10px;border:1px solid #cbd5e1;border-radius:9px">${weeks.map((w,i)=>`<option value="${i}" ${i===state.week?'selected':''}>${i+1}주차 ${w.short}</option>`).join('')}</select><div class="columns"><div class="comparebox"><h4>첫 결과 — 짧은 요청</h4><p>${esc(w.simple)}</p><textarea id="compareOne" placeholder="첫 결과의 특징">${esc(state.compareOne)}</textarea></div><div class="comparebox"><h4>두 번째 결과 — 인터뷰 요청</h4><p>${esc(w.interview)}</p><textarea id="compareTwo" placeholder="두 번째 결과의 특징">${esc(state.compareTwo)}</textarea></div></div><div class="ref"><b>함께 이야기할 질문</b><ul>${w.compare.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`}
function materials(){return `<div class="banner"><h2>수업 자료</h2><p>교사용 링크와 학생용 안내서 활용 방법</p></div><div class="lesson"><h3>학생용 인쇄 안내서</h3><p class="leadin">주차별 A4 1장씩 배포합니다. 이름과 학년을 적고, 짧은 프롬프트와 인터뷰형 프롬프트를 비교합니다.</p><div class="ref"><strong>실습 시 유의</strong><p>이 대시보드는 설명·시연 보조 도구이며 Gemini에 자동 연결되지 않습니다.</p><p>학생은 자신의 PC에서 기획·기록·결과 확인 활동을 하고, 접근 제한이 있는 AI 생성 기능은 강사가 지원합니다.</p></div><button class="secondary" onclick="window.print()">이 화면 인쇄</button></div>`}
function renderGuide(){const w=current(),e=$('#guideContent');e.innerHTML=`<div class="info"><b>🎯 학습 목표</b><p>${w.lesson}</p></div><h4>💬 단계별 강사 멘트</h4><p>${['오늘은 작품을 만들며 AI에게 잘 요청하는 방법을 배워요.','먼저 한 문장만 입력해 봅시다.','AI가 만든 결과는 내 생각과 같나요?','AI에게 질문을 부탁하고 내 생각을 말해 봅시다.','아이의 생각이 빠지지 않았는지 먼저 확인합시다.','어떤 결과가 내 생각에 더 가까운지 이유를 말해 봅시다.'][state.step]}</p><h4>✅ 진행 팁</h4><ul>${w.guide.map(a=>`<li>${a}</li>`).join('')}</ul><h4>⏱ 권장 운영</h4><p>1교시 50분 → 휴식 10분 → 2교시 30분</p><h4>📝 강사 메모 (이 브라우저에 저장)</h4><textarea id="teacherNote" placeholder="수업 중 참고할 내용을 적으세요.">${esc(state.notes)}</textarea>`;$('#teacherNote').addEventListener('input',e=>{state.notes=e.target.value;localStorage.setItem('ai_dashboard_teacher_note',state.notes)})}
function bindReviewLinks(){document.querySelectorAll('[data-review-url]').forEach((link)=>{link.href=link.dataset.reviewUrl;});document.querySelectorAll('[data-review-qr]').forEach((image)=>{image.src=image.dataset.reviewQr;});}
function render(){document.querySelectorAll('nav [data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route));$('#app').innerHTML=state.route==='home'?home():state.route==='prompts'?prompts():state.route==='compare'?compare():state.route==='materials'?materials():lessonView();bindReviewLinks();if(state.guide)renderGuide();$('#prev')?.addEventListener('click',()=>{state.step=Math.max(0,state.step-1);render()});$('#next')?.addEventListener('click',()=>{state.step=Math.min(5,state.step+1);render()});document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{state.step=Number(b.dataset.step);render()}));document.querySelectorAll('#app [data-route]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.route)));document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>clipboard(decodeURIComponent(b.dataset.copy))));$('#word')?.addEventListener('input',e=>{state.words[state.week]=e.target.value;const p=e.target.closest('.lesson').querySelector('.prompt');if(p){let t=actualPrompt();p.querySelector('strong').innerHTML=esc(t).replace(/\[([^\]]+)\]/g,'<span class="highlight">[$1]</span>');p.querySelector('[data-copy]').dataset.copy=encodeURIComponent(t)}});$('#cw')?.addEventListener('change',e=>{state.week=Number(e.target.value);state.compareOne='';state.compareTwo='';render()});['One','Two'].forEach(i=>$('#compare'+i)?.addEventListener('input',e=>{state['compare'+i]=e.target.value}));}
function go(route){state.route=route;if(/^\d$/.test(route)){state.week=Number(route);state.step=0}state.compareOne='';state.compareTwo='';render()}
document.querySelectorAll('nav [data-route]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.route)));
$('#guideToggle').addEventListener('click',()=>{state.guide=!state.guide;$('#guide').hidden=!state.guide;document.body.classList.toggle('guide-open',state.guide);$('#guideToggle').setAttribute('aria-expanded',String(state.guide));$('#guideToggle').textContent=state.guide?'✕ 가이드 닫기':'☰ 강사 가이드';render()});
$('#presentation').addEventListener('click',()=>{state.presentation=!state.presentation;document.body.classList.toggle('presentation',state.presentation);$('#presentation').textContent=state.presentation?'↩ 기본 화면':'⛶ 큰 화면';$('#presentation').setAttribute('aria-pressed',String(state.presentation))});
render();
document.addEventListener('click',e=>{const tab=e.target.closest('[data-w3tab]');if(tab){w3.tab=tab.dataset.w3tab;render();return}const card=e.target.closest('[data-w3card]');if(card){const box=$('#w3-card-box-'+card.dataset.w3card);if(box)clipboard(box.innerText.replace(/\s+/g,' ').trim());return}const opt=e.target.closest('[data-bcat]');if(opt){w3[opt.dataset.bcat]=opt.dataset.bval;render();return}if(e.target.closest('#w3-random')){w3.mood=builderOptions.moods[Math.floor(Math.random()*builderOptions.moods.length)].label;w3.style=builderOptions.styles[Math.floor(Math.random()*builderOptions.styles.length)].label;w3.instrument=builderOptions.instruments[Math.floor(Math.random()*builderOptions.instruments.length)].label;render()}});
document.addEventListener('input',e=>{const blank=e.target.closest('[data-blank]');if(blank)w3.blanks[blank.dataset.blank]=blank.textContent});
</script></body></html>
