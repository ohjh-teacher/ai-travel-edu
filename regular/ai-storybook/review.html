<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI 그림동화책 정규과정 1주차 후기와 워크시트를 제출합니다.">
  <meta name="robots" content="noindex, nofollow">
  <title>1주차 후기 제출 | AI 그림동화책</title>
  <link rel="stylesheet" href="../../special/special.css?v=20260731-1">
</head>
<body>
  <header class="special-topbar">
    <span class="brand-link">AI 그림동화책 · 1주차 후기 제출</span>
  </header>

  <main class="review-page">
    <section class="review-page-hero" aria-labelledby="reviewPageTitle">
      <p class="eyebrow">CLASS REVIEW</p>
      <h1 id="reviewPageTitle">AI 그림동화책 1주차<br>후기 남기기</h1>
      <p>오늘 발견한 이야기와 작성한 워크시트를 함께 기록해 주세요.</p>
    </section>

    <form class="special-review-form" id="storybookReviewForm">
      <div class="review-form-heading">
        <p class="section-number">기본 정보</p>
        <h2>누가 참여했나요?</h2>
      </div>

      <div class="review-field-grid">
        <label>
          <span>수업 연도</span>
          <select id="storybookReviewYear"></select>
        </label>
        <label>
          <span>기관명</span>
          <select id="storybookReviewInstitution">
            <option value="">기관을 선택해 주세요</option>
          </select>
        </label>
        <label class="review-course-fixed">
          <span>참여 과정</span>
          <input id="storybookReviewCourse" type="text" value="AI 그림동화책 정규과정" readonly>
        </label>
        <label>
          <span>이름</span>
          <input id="storybookReviewName" type="text" autocomplete="name" placeholder="이름을 입력해 주세요">
        </label>
        <label>
          <span>휴대전화 뒷번호 4자리</span>
          <input id="storybookReviewPhone" type="text" inputmode="numeric" maxlength="4" placeholder="예: 1234">
        </label>
      </div>

      <section class="review-checklist" aria-labelledby="reviewChecklistTitle">
        <h3 id="reviewChecklistTitle">오늘 해낸 것</h3>
        <div class="review-checklist-items">
          <label><input type="checkbox" name="storybookCompleted" value="내 이야기의 소재를 찾았습니다."> <span>내 이야기의 소재를 찾았습니다.</span></label>
          <label><input type="checkbox" name="storybookCompleted" value="이야기 발견 질문에 답했습니다."> <span>이야기 발견 질문에 답했습니다.</span></label>
          <label><input type="checkbox" name="storybookCompleted" value="사진 10장과 추억 10개를 정리했습니다."> <span>사진 10장과 추억 10개를 정리했습니다.</span></label>
          <label><input type="checkbox" name="storybookCompleted" value="동화로 만들고 싶은 장면을 골랐습니다."> <span>동화로 만들고 싶은 장면을 골랐습니다.</span></label>
        </div>
      </section>

      <label class="review-wide-field">
        <span>오늘 수업에서 가장 기억에 남은 점</span>
        <textarea id="storybookReviewText" rows="5" placeholder="예: 평범한 일상도 나만의 동화가 될 수 있다는 점이 인상 깊었어요."></textarea>
      </label>

      <label class="review-wide-field">
        <span>작성한 워크시트 이미지 첨부</span>
        <input id="storybookReviewFiles" type="file" accept="image/*" multiple>
        <em>워크시트 사진을 최대 3장, 장당 5MB 이하로 첨부할 수 있습니다.</em>
      </label>

      <div class="special-review-privacy">
        <label><input id="storybookReviewPrivacy" type="checkbox"> 후기 저장을 위한 개인정보 수집에 동의합니다.</label>
        <p>이름, 휴대전화 뒷번호, 과정명, 후기와 첨부 이미지를 수업 기록 관리에 사용합니다.</p>
      </div>

      <button class="review-submit-button" id="storybookReviewSubmit" type="submit">후기와 워크시트 제출하기</button>
      <p class="review-submit-message" id="storybookReviewMessage" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="../../shared/scripts/firebase-config.js"></script>
  <script src="review.js?v=20260731-1"></script>
</body>
</html>
