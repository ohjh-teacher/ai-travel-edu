 {title:'AI야, 내 상상을 그려줘!',short:'그림 만들기',icon:'🎨',mission:'AI에게 잘 부탁해서 내가 상상한 그림 만들기',simple:'[토끼]를 그려줘.',word:'토끼',interview:'나는 초등학교 저학년이야. 그림을 만들고 싶어. 쉬운 말로 하나씩 질문해 줘.',examples:['어떤 그림을 만들고 싶니?','주인공은 무엇이니?','주인공은 무엇을 하고 있니?','어디에 있니?','언제의 장면이니?','주인공의 표정과 기분은 어떠니?','어떤 색이나 분위기를 넣고 싶니?','그림은 어떤 모습으로 보이면 좋겠니?','함께 넣고 싶은 친구나 물건이 있니?','그림을 본 사람이 어떤 기분을 느끼면 좋겠니?'],improve:'[토끼의 옷을 파란색]으로 바꿔줘.',compare:['내가 상상한 주인공인가요?','내가 정한 장소가 나오나요?','내가 원하는 느낌인가요?'],lesson:'AI에게 내가 원하는 모습을 더 자세히 알려주면 도움이 돼요.',guide:['처음 결과를 정답처럼 평가하지 않습니다.','아이의 자유로운 상상을 먼저 들으세요.','학생의 아이디어가 누락되었는지 확인합니다.']},

 {title:'AI야, 내 노래를 만들어줘!',short:'음악 만들기',icon:'🎵',mission:'내 생각과 기분을 담아 나만의 노래 만들기',simple:'[친구] 노래를 만들어줘.',word:'친구',interview:'나는 초등학교 저학년이야. 노래를 만들고 싶어. 쉬운 말로 하나씩 질문해 줘. 음악 장르도 물어봐 줘.',examples:['노래의 주제는 무엇이니?','어떤 이야기를 들려주고 싶니?','노래에 어떤 기분을 담고 싶니?','꼭 넣고 싶은 말이나 문장이 있니?','어떤 음악 장르가 좋니?','노래는 빠르고 신나게 할까, 느리고 잔잔하게 할까?','노래를 부르는 목소리는 어떤 느낌이면 좋겠니?','반복해서 들려주고 싶은 후렴구가 있니?','노래는 어떻게 끝나면 좋겠니?','노래 제목은 무엇으로 하고 싶니?'],improve:'[노래를 더 신나게] 만들어줘.',compare:['원하는 주제가 나왔나요?','선택한 장르와 비슷한가요?','내 말이 가사에 있나요?'],lesson:'가사를 확인하고 “노래 만들어줘”라고 부탁할 수 있어요.',guide:['주 실습: 인터뷰 → 가사 확인 → “노래 만들어줘”.','음악 모드의 장르·보컬·길이는 선택형 참고 사항입니다.','음악 생성은 이용 자격이 있는 강사가 수행합니다.']},

const REVIEW_BASE='https://aitraveledu.web.app/regular/yongsan-elementary-ai/review.html';
function reviewPanel(){const week=state.week+1;const url=REVIEW_BASE+'?week='+week;const qr='https://api.qrserver.com/v1/create-qr-code/?size=420x420&data='+encodeURIComponent(url);return '<section class="review-qr-panel" aria-labelledby="reviewQrTitle"><h4 id="reviewQrTitle">이번 주 수업 후기 남기기</h4><p>수업을 마친 뒤 스마트폰 카메라로 QR코드를 촬영해 후기를 작성해 주세요.</p><div class="review-qr-layout"><a class="review-qr-link" href="https://aitraveledu.web.app/regular/yongsan-elementary-ai/review.html" data-review-url="'+url+'" target="_blank" rel="noopener noreferrer"><img src="https://api.qrserver.com/v1/create-qr-code/?size=420x420" data-review-qr="'+qr+'" alt="'+week+'주차 후기 작성 QR코드"></a><div><strong>'+week+'주차 · '+current().short+' 후기</strong><p>QR코드 또는 아래 버튼을 누르면 후기 화면이 새 탭으로 열립니다. 강의 화면은 그대로 유지됩니다.</p><a class="review-qr-open" href="https://aitraveledu.web.app/regular/yongsan-elementary-ai/review.html" data-review-url="'+url+'" target="_blank" rel="noopener noreferrer">후기 화면 새 탭으로 열기 ↗</a></div></div></section>'}
function storybookPage(){return `<div class="ref storybook-card"><strong>Gemini Gems Storybook에서 동화 만들기</strong><p>10개의 질문 뒤 만든 줄거리를 복사해 Storybook의 프롬프트 창에 입력해 보세요.</p><ol><li>아래 버튼을 눌러 Gemini를 새 탭에서 엽니다.</li><li>Gems에서 Storybook을 선택합니다.</li><li>앞에서 만든 줄거리를 프롬프트 창에 붙여넣고 동화를 만들어 봅니다.</li></ol><a class="primary" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini Gems Storybook 열기 ↗</a></div>`}
function comicPage(){return `<div class="ref comic-prompt-card"><strong>줄거리 다음 단계: 6컷 만화 만들기</strong><p>줄거리를 만들었던 같은 Gemini 대화창에서 이어서 실행해 보세요.</p><p>아래 프롬프트를 입력하면 이야기를 6장면으로 나누고, 각 장면에 대사가 있는 만화로 구성합니다.</p>${command("동화를 6장면으로 구성해서 대사가 있는 6컷 만화로 만들어줘","6컷 만화 프롬프트 복사")}</div>`}
function content(){let w=current(),s=state.step; if(s===0)return `<h3 class="sectiontitle">✨ 오늘의 미션</h3><p class="leadin">오늘은 <b>짧게 부탁하는 방법</b>과 <b>질문을 주고받는 방법</b>으로 작품을 만들어요.</p><div class="ref"><strong>우리의 수업 순서</strong><p>간단히 요청 → 첫 결과 확인 → 인터뷰 → 다시 만들기 → 비교하고 수정</p></div><div class="callout">AI는 내 마음을 읽지 못해요. 내가 원하는 것을 자세히 알려줄수록 도움이 될 수 있어요.</div>`;
 if(s===1)return `<h3 class="sectiontitle">② 간단하게 요청하기</h3><p class="leadin">먼저 아주 짧게 부탁해 봐요. <b>[ ] 안의 말</b>을 내가 원하는 주제로 바꿔 보세요.</p><div class="fieldrow"><label for="word">바꿀 말</label><input id="word" maxlength="45" value="${esc(state.words[state.week])}" placeholder="예: ${esc(w.word)}" aria-label="프롬프트에서 바꿀 말"></div>${command(actualPrompt())}<div class="hint">학생의 관심사를 반영해 [ ] 안의 말만 바꾸면 됩니다. 문장 전체를 길게 입력할 필요는 없어요.</div>`;
 if(s===2)return `<h3 class="sectiontitle">③ 첫 번째 결과 확인</h3><p class="leadin">강사가 방금 만든 결과를 화면에 띄우고, 우리가 생각한 모습과 어떻게 다른지 함께 살펴봅니다.</p><div class="ref"><strong>같이 관찰해 볼 점</strong><p>• 내가 정한 주제와 주인공이 잘 보이나요?</p><p>• 장소와 분위기가 내가 상상한 모습과 비슷한가요?</p><p>• 더 자세히 알려주고 싶은 부분은 무엇인가요?</p></div><div class="hint">지금은 프롬프트를 다시 입력하지 않아요. 결과를 보고 다음 인터뷰에서 어떤 내용을 더 말할지 생각해 봅니다.</div>`;
 if(s===3)return `<h3 class="sectiontitle">④ AI에게 인터뷰 부탁하기</h3><p class="leadin">이번에는 생각을 더 자세히 알려줘요. AI에게 <b>질문 10개를 하나씩</b> 부탁해 봅시다.</p>${command(w.interview)}<div class="ref"><strong>인터뷰 질문 10개 — 실제 질문은 아이 답변에 따라 달라질 수 있어요</strong>${w.examples.map((x,i)=>`<p>${i+1}. ${x}</p>`).join("")}</div>${state.week===1?`<div class="ref story-prompt-card"><strong>10개 질문이 끝난 뒤: 줄거리 만들기</strong><p>학생의 답변을 모두 확인한 다음, 아래 프롬프트를 별도로 실행합니다.</p>${command("줄거리를 300자로 정리해줘.","줄거리 만들기 프롬프트 복사")}</div>`:""}<div class="hint">아이들이 자기 생각을 자유롭게 답하는 것이 핵심입니다. 10개 질문이 끝난 뒤 2주차에는 별도 카드의 프롬프트로 줄거리를 정리합니다.</div>`;
 if(s===4)return `<h3 class="sectiontitle">⑤ 두 번째 결과 만들기</h3><p class="leadin">인터뷰에서 나온 학생의 생각을 짧은 요청문으로 정리하고, 학생에게 확인받습니다.</p><div class="ref"><strong>학생이 정한 내용을 바탕으로 다시 요청</strong><p>아이의 주제·마음·특징·규칙을 빠뜨리지 않고 반영하세요.</p></div>${state.week===1?storybookPage():''}${state.week===2?`<div class="callout">🎶 노래 만들기: 먼저 AI가 만든 <b>가사</b>를 확인해요. 마음에 들면 ${command('노래 만들어줘.','복사')}</div><div class="ref"><strong>참고 · 음악 모드를 직접 선택하는 경우</strong><p>장르: 팝 / K팝 / 힙합·랩 등 · 보컬: 목소리 있음/악기만 · 길이: 화면에 제공되는 옵션</p><p class="small">설정 선택은 대화형 인터뷰의 필수 단계가 아닙니다.</p></div>`:''}<div class="hint">해당 기능의 계정·연령 제한과 생성 한도에 따라 강사 시연 또는 사전 제작 결과물을 사용합니다.</div>`;
 return `${state.week===1?comicPage():''}<h3 class="sectiontitle">⑥ 두 결과 비교하고 수정하기</h3><p class="leadin">무조건 두 번째가 더 좋은 것은 아니에요. <b>내 생각이 얼마나 반영됐는지</b> 살펴봅니다.</p><div class="columns"><div class="comparebox"><h4>처음 만든 결과</h4><textarea id="compareOne" placeholder="첫 번째 결과의 특징을 적으세요.">${esc(state.compareOne)}</textarea></div><div class="comparebox"><h4>인터뷰 후 결과</h4><textarea id="compareTwo" placeholder="두 번째 결과의 특징을 적으세요.">${esc(state.compareTwo)}</textarea></div></div><ul>${w.compare.map(x=>`<li>${x}</li>`).join('')}</ul><div class="ref"><strong>수정 요청 예시</strong>${command(w.improve)}</div><div class="callout">${w.lesson}</div>${reviewPanel()}</div>`;
}
function lessonView(){return banner()+steppers()+`<div class="lesson">${content()}<div class="stagefoot"><button class="secondary" id="prev" ${state.step===0?'disabled':''}>← 이전 단계</button><span class="count">${state.step+1} / 6</span><button class="primary" id="next" ${state.step===5?'disabled':''}>다음 단계 →</button></div></div>`}
function home(){return `<div class="banner"><div class="eyebrow">4주 과정 · 초등 2~4학년 · 10~15명 · PC 1인 1대</div><h2>AI와 함께 내 작품 만들기</h2><p>짧게 부탁하기 → 인터뷰하기 → 비교하고 고쳐 보기</p></div><div class="cards">${weeks.map((w,i)=>`<button class="lessoncard" data-route="${i}"><div style="font-size:34px">${w.icon}</div><b>${i+1}주차 · ${w.short}</b><span>${w.mission}</span></button>`).join('')}</div><div class="callout">4주 공통 목표: AI에게 잘 요청하고, 내 아이디어를 스스로 기획하는 창작자가 되기</div>`}
function prompts(){return `<div class="banner"><h2>프롬프트 모음</h2><p>학생이 바꾸는 부분을 [ ]로 표시합니다.</p></div><div class="lesson">${weeks.map((w,i)=>`<div class="ref"><strong>${i+1}주차 · ${w.short}</strong><div class="label">먼저 짧게 요청</div>${command(w.simple)}<div class="label">인터뷰 요청</div>${command(w.interview)}</div>`).join('')}</div>`}
function compare(){let w=current();return `<div class="banner"><h2>결과 비교 예시</h2><p>두 가지 요청 방식의 차이를 학생과 함께 관찰합니다.</p></div><div class="lesson"><label class="label" for="cw">차시 선택</label><select id="cw" style="padding:12px;margin:0 0 20px 10px;border:1px solid #cbd5e1;border-radius:9px">${weeks.map((w,i)=>`<option value="${i}" ${i===state.week?'selected':''}>${i+1}주차 ${w.short}</option>`).join('')}</select><div class="columns"><div class="comparebox"><h4>첫 결과 — 짧은 요청</h4><p>${esc(w.simple)}</p><textarea id="compareOne" placeholder="첫 결과의 특징">${esc(state.compareOne)}</textarea></div><div class="comparebox"><h4>두 번째 결과 — 인터뷰 요청</h4><p>${esc(w.interview)}</p><textarea id="compareTwo" placeholder="두 번째 결과의 특징">${esc(state.compareTwo)}</textarea></div></div><div class="ref"><b>함께 이야기할 질문</b><ul>${w.compare.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`}
function materials(){return `<div class="banner"><h2>수업 자료</h2><p>교사용 링크와 학생용 안내서 활용 방법</p></div><div class="lesson"><h3>학생용 인쇄 안내서</h3><p class="leadin">주차별 A4 1장씩 배포합니다. 이름과 학년을 적고, 짧은 프롬프트와 인터뷰형 프롬프트를 비교합니다.</p><div class="ref"><strong>실습 시 유의</strong><p>이 대시보드는 설명·시연 보조 도구이며 Gemini에 자동 연결되지 않습니다.</p><p>학생은 자신의 PC에서 기획·기록·결과 확인 활동을 하고, 접근 제한이 있는 AI 생성 기능은 강사가 지원합니다.</p></div><button class="secondary" onclick="window.print()">이 화면 인쇄</button></div>`}
function renderGuide(){const w=current(),e=$('#guideContent');e.innerHTML=`<div class="info"><b>🎯 학습 목표</b><p>${w.lesson}</p></div><h4>💬 단계별 강사 멘트</h4><p>${['오늘은 작품을 만들며 AI에게 잘 요청하는 방법을 배워요.','먼저 한 문장만 입력해 봅시다.','AI가 만든 결과는 내 생각과 같나요?','AI에게 질문을 부탁하고 내 생각을 말해 봅시다.','아이의 생각이 빠지지 않았는지 먼저 확인합시다.','어떤 결과가 내 생각에 더 가까운지 이유를 말해 봅시다.'][state.step]}</p><h4>✅ 진행 팁</h4><ul>${w.guide.map(a=>`<li>${a}</li>`).join('')}</ul><h4>⏱ 권장 운영</h4><p>1교시 50분 → 휴식 10분 → 2교시 30분</p><h4>📝 강사 메모 (이 브라우저에 저장)</h4><textarea id="teacherNote" placeholder="수업 중 참고할 내용을 적으세요.">${esc(state.notes)}</textarea>`;$('#teacherNote').addEventListener('input',e=>{state.notes=e.target.value;localStorage.setItem('ai_dashboard_teacher_note',state.notes)})}
function bindReviewLinks(){document.querySelectorAll('[data-review-url]').forEach((link)=>{link.href=link.dataset.reviewUrl;});document.querySelectorAll('[data-review-qr]').forEach((image)=>{image.src=image.dataset.reviewQr;});}
function render(){document.querySelectorAll('nav [data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route));$('#app').innerHTML=state.route==='home'?home():state.route==='prompts'?prompts():state.route==='compare'?compare():state.route==='materials'?materials():lessonView();bindReviewLinks();if(state.guide)renderGuide();$('#prev')?.addEventListener('click',()=>{state.step=Math.max(0,state.step-1);render()});$('#next')?.addEventListener('click',()=>{state.step=Math.min(5,state.step+1);render()});document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{state.step=Number(b.dataset.step);render()}));document.querySelectorAll('#app [data-route]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.route)));document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>clipboard(decodeURIComponent(b.dataset.copy))));$('#word')?.addEventListener('input',e=>{state.words[state.week]=e.target.value;const p=e.target.closest('.lesson').querySelector('.prompt');if(p){let t=actualPrompt();p.querySelector('strong').innerHTML=esc(t).replace(/\[([^\]]+)\]/g,'<span class="highlight">[$1]</span>');p.querySelector('[data-copy]').dataset.copy=encodeURIComponent(t)}});$('#cw')?.addEventListener('change',e=>{state.week=Number(e.target.value);state.compareOne='';state.compareTwo='';render()});['One','Two'].forEach(i=>$('#compare'+i)?.addEventListener('input',e=>{state['compare'+i]=e.target.value}));}
function go(route){state.route=route;if(/^\d$/.test(route)){state.week=Number(route);state.step=0}state.compareOne='';state.compareTwo='';render()}
document.querySelectorAll('nav [data-route]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.route)));
$('#guideToggle').addEventListener('click',()=>{state.guide=!state.guide;$('#guide').hidden=!state.guide;document.body.classList.toggle('guide-open',state.guide);$('#guideToggle').setAttribute('aria-expanded',String(state.guide));$('#guideToggle').textContent=state.guide?'✕ 가이드 닫기':'☰ 강사 가이드';render()});
$('#presentation').addEventListener('click',()=>{state.presentation=!state.presentation;document.body.classList.toggle('presentation',state.presentation);$('#presentation').textContent=state.presentation?'↩ 기본 화면':'⛶ 큰 화면';$('#presentation').setAttribute('aria-pressed',String(state.presentation))});
render();
</script></body></html>
