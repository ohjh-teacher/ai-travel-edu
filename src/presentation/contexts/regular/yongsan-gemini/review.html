<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="용산청소년센터 Gemini 생성형 AI 놀이터 1주차 후기 화면 미리보기">
  <title>1주차 후기 쓰기 | Gemini 생성형 AI 놀이터</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <header><a href="week-1/index.html">← 1주차 수업으로</a><span>용산청소년센터 · Gemini 놀이터</span></header>
  <main>
    <section class="intro">
      <p class="eyebrow">1주차 수업 후기</p>
      <h1>오늘 AI와 만든 그림,<br>어땠나요?</h1>
      <p>정답은 없어요. 내가 해 본 일을 짧게 적어 주세요.</p>
    </section>
    <p class="preview-note" role="status">현재는 후기 화면 미리보기입니다. 제출 기능은 연결 전입니다.</p>
    <form>
      <section class="basic-info" aria-labelledby="basicInfoTitle">
        <h2 id="basicInfoTitle">먼저 적어 주세요</h2>
        <label><span>수업과정</span><input type="text" value="Gemini 생성형 AI 놀이터 · 1주차" readonly></label>
        <label><span>이름</span><input type="text" name="studentName" autocomplete="name" maxlength="30" placeholder="내 이름을 적어 주세요." required></label>
      </section>
      <label class="question">
        <span class="question-label"><b>1</b> AI에게 처음 어떤 그림을 만들어 달라고 말했나요?</span>
        <textarea rows="2" maxlength="300" placeholder="예: 축구하는 문어를 그려 줘." required></textarea>
      </label>
      <label class="question">
        <span class="question-label"><b>2</b> AI가 만든 그림에서 내 생각과 달랐던 부분은 무엇인가요?</span>
        <textarea rows="2" maxlength="300" placeholder="예: 운동장이라고 생각했는데 바닷속으로 나왔어요." required></textarea>
      </label>
      <label class="question">
        <span class="question-label"><b>3</b> 그 부분을 고치려고 AI에게 어떤 말을 했나요?</span>
        <textarea rows="2" maxlength="300" placeholder="예: 학교 운동장으로 바꿔 줘. 아직 고치지 않았다면 그렇게 적어도 돼요." required></textarea>
      </label>
      <fieldset class="question rating">
        <legend class="question-label"><b>4</b> 오늘 수업은 어땠나요?</legend>
        <div class="rating-options">
          <label><input type="radio" name="satisfaction" value="1" required><span>많이 아쉬워요</span></label>
          <label><input type="radio" name="satisfaction" value="2"><span>조금 아쉬워요</span></label>
          <label><input type="radio" name="satisfaction" value="3"><span>보통이에요</span></label>
          <label><input type="radio" name="satisfaction" value="4"><span>재미있었어요</span></label>
          <label><input type="radio" name="satisfaction" value="5"><span>정말 재미있었어요</span></label>
        </div>
      </fieldset>
      <label class="question">
        <span class="question-label"><b>5</b> 가장 재미있었던 것이나 다음 시간에 더 해보고 싶은 것을 써 주세요.</span>
        <textarea rows="3" maxlength="500" placeholder="한 줄 이상 꼭 적어 주세요." required></textarea>
      </label>
      <p class="privacy-note">이름은 위 칸에만 적고, 답변에는 학교·전화번호·비밀번호를 적지 마세요.</p>
      <button type="button" disabled>제출 기능 연결 전</button>
    </form>
  </main>
</body>
</html>
