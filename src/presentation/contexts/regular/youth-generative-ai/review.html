<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="청년 7주 생성형 AI 정규과정 후기 제출">
  <title>수업 후기 제출 | 생성형 AI, 일상에서 콘텐츠 제작까지</title>
  <link rel="stylesheet" href="review.css">
  <script defer src="../../shared/scripts/firebase-config.js"></script>
  <script defer src="review.js"></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">CLASS REVIEW</p><h1 id="review-title">오늘의 수업 후기</h1><p>짧은 표현으로도 괜찮습니다. 오늘 직접 해 본 일을 남겨 주세요.</p></header>
    <form id="review-form">
      <label><span>참여 과정</span><input value="생성형 AI, 일상에서 콘텐츠 제작까지" readonly></label>
      <label><span>이름</span><input id="student-name" type="text" autocomplete="name" maxlength="30" required></label>
      <label><span>기관명 (없으면 비워두세요)</span><input id="institution-name" type="text" maxlength="60" placeholder="예: 청년센터"></label>
      <label><span>오늘 직접 만든 결과물은 무엇인가요?</span><textarea id="result-answer" rows="3" maxlength="500" required placeholder="예: 주제 카드, 이미지 한 장"></textarea></label>
      <label><span>가장 어려웠거나 다음에 고쳐 보고 싶은 점은 무엇인가요?</span><textarea id="next-answer" rows="3" maxlength="500" required placeholder="한 단어나 짧은 문장도 괜찮습니다."></textarea></label>
      <fieldset><legend>오늘 수업은 어땠나요?</legend><div class="ratings">
        <label><input type="radio" name="rating" value="1" required> 많이 아쉬워요</label>
        <label><input type="radio" name="rating" value="2"> 조금 아쉬워요</label>
        <label><input type="radio" name="rating" value="3"> 보통이에요</label>
        <label><input type="radio" name="rating" value="4"> 좋았어요</label>
        <label><input type="radio" name="rating" value="5"> 정말 좋았어요</label>
      </div></fieldset>
      <p class="privacy">답변에는 전화번호, 주소, 비밀번호 등 개인정보를 적지 마세요. 이름과 답변은 수업 기록을 위해 저장하고 관리자만 조회합니다.</p>
      <label class="consent"><input id="consent" type="checkbox" required> 이름과 후기를 수업 기록으로 저장하는 데 동의합니다.</label>
      <button id="submit-button" type="submit">후기 제출하기</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
