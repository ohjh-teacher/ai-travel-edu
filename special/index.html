<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI와 여행을 주제로 한 90분 단기특강 자료입니다.">
  <title>단기특강 | AI와 함께 떠나는 스마트 여행 생활</title>
  <link rel="stylesheet" href="special.css">
</head>
<body>
  <header class="special-topbar">
    <a class="brand-link" href="../">AI 스마트 여행</a>
    <a class="back-link" href="../">정규과정 보기</a>
  </header>

  <main class="library-page">
    <section class="library-hero" aria-labelledby="libraryTitle">
      <p class="eyebrow">SHORT CLASS COLLECTION</p>
      <h1 id="libraryTitle">단기특강</h1>
      <p>한 번의 수업으로 AI를 직접 사용하고, 나만의 결과물을 완성하는 실습형 특강입니다.</p>
    </section>

    <section aria-labelledby="lectureListTitle">
      <div class="section-heading">
        <div>
          <p class="section-number">01</p>
          <h2 id="lectureListTitle">진행할 특강</h2>
        </div>
        <p>스마트폰 한 대로 참여할 수 있습니다.</p>
      </div>

      <a class="lecture-card" href="custom-travel/">
        <div class="lecture-card-main">
          <div class="lecture-badges">
            <span>90분</span>
            <span>입문</span>
            <span>실습형</span>
          </div>
          <p class="lecture-kicker">AI INTERVIEW × TRAVEL</p>
          <h3>AI 가이드와 함께 떠나는 맞춤 여행</h3>
          <p>AI의 질문에 답하며 나에게 어울리는 여행을 제안받고, 여행 포스터 또는 인포그래픽을 만들어봅니다.</p>
        </div>
        <div class="lecture-card-result" aria-label="완성 결과물">
          <span>완성 결과물</span>
          <strong>나만의 여행 이미지 1장</strong>
          <b>특강 자료 열기 →</b>
        </div>
      </a>
    </section>
  </main>

</html>
