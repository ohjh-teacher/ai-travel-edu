<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="동작구 취업지원 실무 특강 후기를 제출합니다.">
  <title>특강 후기 제출 | 동작취업지원센터</title>
  <link rel="stylesheet" href="../special.css?v=20261027-1">
</head>
<body data-lecture-id="dongjak-employment-ai" data-lecture-title="생성형 AI를 활용한 취업지원 실무" data-institution-key="dongjak-employment-center" data-institution-name="동작취업지원센터">
  <header class="special-topbar">
    <a class="brand-link" href="./">특강으로 돌아가기</a>
    <a class="back-link" href="../../">전체 과정으로</a>
  </header>
  <main class="review-page">
    <section class="review-page-hero" aria-labelledby="reviewPageTitle">
      <p class="eyebrow">CLASS REVIEW</p>
      <h1 id="reviewPageTitle">취업지원 실무 특강<br>후기 남기기</h1>
      <p>오늘 배운 내용과 업무에 적용해 보고 싶은 점을 기록해 주세요.</p>
    </section>
    <form class="special-review-form" id="specialReviewForm">
      <div class="review-form-heading"><p class="section-number">기본 정보</p><h2>누가 참여했나요?</h2></div>
      <div class="review-field-grid">
        <label><span>수업 연도</span><select id="specialReviewYear"></select></label>
        <label><span>참여 기관</span><select id="specialReviewInstitution"></select></label>
        <label><span>이름</span><input id="specialReviewName" type="text" autocomplete="name" placeholder="이름을 입력해 주세요"></label>
        <label><span>휴대전화 뒷번호 4자리</span><input id="specialReviewPhone" type="text" inputmode="numeric" maxlength="4" placeholder="예: 1234"></label>
      </div>
      <section class="review-checklist" aria-labelledby="reviewChecklistTitle">
        <h3 id="reviewChecklistTitle">오늘 해낸 것</h3>
        <div class="review-checklist-items">
          <label><input type="checkbox" name="specialCompleted" value="취업지원 업무에 쓸 AI 프롬프트를 연습했습니다."> <span>취업지원 업무에 쓸 AI 프롬프트를 연습했습니다.</span></label>
          <label><input type="checkbox" name="specialCompleted" value="상담·서류 첨삭 사례를 살펴봤습니다."> <span>상담·서류 첨삭 사례를 살펴봤습니다.</span></label>
          <label><input type="checkbox" name="specialCompleted" value="일자리 매칭과 데이터 분석 방법을 익혔습니다."> <span>일자리 매칭과 데이터 분석 방법을 익혔습니다.</span></label>
        </div>
      </section>
      <label class="review-wide-field"><span>오늘 배운 내용 중 업무에 적용해 보고 싶은 점</span><textarea id="specialReviewText" rows="5" placeholder="짧은 문장으로 적어 주세요."></textarea></label>
      <label class="review-wide-field"><span>활동 이미지 추가 (선택)</span><input id="specialReviewFiles" type="file" accept="image/*" multiple><em>사진은 최대 3장, 한 장당 5MB 이하로 올릴 수 있습니다.</em></label>
      <div class="special-review-privacy">
        <label><input id="specialReviewPrivacy" type="checkbox"> 후기 저장을 위한 개인정보 수집에 동의합니다.</label>
        <p>이름, 휴대전화 뒷번호, 기관명, 후기와 선택한 이미지를 수업 기록 관리에 사용합니다.</p>
      </div>
      <button class="review-submit-button" id="specialReviewSubmit" type="submit">특강 후기 제출하기</button>
      <p class="review-submit-message" id="specialReviewMessage" role="status" aria-live="polite"></p>
      <a class="review-return-button" id="specialReviewReturn" href="./" hidden>특강 자료로 돌아가기</a>
    </form>
  </main>
  <script src="../../shared/scripts/firebase-config.js"></script>
  <script src="../custom-travel/special-review.js?v=20260729-5"></script>
</body>
</html>
